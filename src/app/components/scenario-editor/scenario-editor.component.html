<div class="scenario-editor">
  <div class="editor-header">
    <h1>Scenario Editor</h1>
    <p>Create and configure network simulation scenarios</p>
    <div class="backend-status" [class.backend-available]="isBackendAvailable" [class.backend-unavailable]="!isBackendAvailable">
      <span class="status-indicator"></span>
      {{ isBackendAvailable ? 'Backend Connected' : 'Backend Offline' }}
    </div>
  </div>

  <div class="editor-content">
    <div class="form-section">
      <h2>Scenario Details</h2>
      
      <div class="form-group">
        <label for="scenarioName">Scenario Name</label>
        <input 
          id="scenarioName"
          type="text" 
          [(ngModel)]="scenario.name" 
          placeholder="Enter scenario name"
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <select 
          id="difficulty"
          [(ngModel)]="scenario.difficulty" 
          class="form-select"
        >
          <option *ngFor="let option of difficultyOptions" [value]="option">
            {{ option }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="timeLimit">Time Limit (minutes)</label>
        <input 
          id="timeLimit"
          type="number" 
          [(ngModel)]="scenario.timeLimit" 
          min="1"
          max="120"
          class="form-input"
        >
      </div>

      <div class="button-group">
        <button (click)="saveScenario()" class="save-button" [disabled]="isSaving">
          {{ isSaving ? '⏳ Saving...' : '💾 Save Scenario' }}
        </button>
        <button (click)="exportScenario()" class="export-button">
          📤 Export
        </button>
        <button (click)="clearScenario()" class="clear-button">
          🗑️ Clear
        </button>
      </div>
      
      <div class="backend-actions" *ngIf="isBackendAvailable">
        <button (click)="loadScenariosFromBackend()" class="load-backend-button">
          📥 Load from Backend
        </button>
        <button (click)="deleteScenarioFromBackend()" class="delete-backend-button" [disabled]="!scenario.id">
          🗑️ Delete from Backend
        </button>
      </div>
      
      <div class="load-section">
        <label for="loadFile" class="load-button">
          📁 Load Scenario
        </label>
        <input 
          id="loadFile"
          type="file" 
          accept=".json"
          (change)="loadScenario($event)"
          style="display: none;"
        >
      </div>
    </div>

    <div class="device-section">
      <app-device-list></app-device-list>
    </div>

    <div class="canvas-section">
      <h2>Network Canvas</h2>
      <div 
        class="canvas-area"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
        (mousemove)="onCanvasMouseMove($event); onCanvasMouseMoveForConnection($event)"
        (mouseup)="onCanvasMouseUp()"
        (mouseleave)="onCanvasMouseUp(); cancelConnectionDrawing()"
      >
        <!-- SVG for connections -->
        <svg class="connections-svg" *ngIf="scenario.connections.length > 0 || isDrawingConnection">
          <!-- Existing connections -->
          <path 
            *ngFor="let connection of scenario.connections" 
            [attr.d]="getConnectionPath(connection)"
            class="connection-line"
            [class.connection-active]="connection.status === 'active'"
            [class.connection-failed]="connection.status === 'failed'"
            [class.connection-disabled]="connection.status === 'disabled'"
            (click)="deleteConnection(connection)"
          />
          
          <!-- Connection preview line -->
          <path 
            *ngIf="isDrawingConnection && connectionStartDevice"
            [attr.d]="'M ' + (connectionStartDevice.position.x + 40) + ' ' + (connectionStartDevice.position.y + 30) + ' L ' + connectionPreview.x + ' ' + connectionPreview.y"
            class="connection-preview"
          />
        </svg>
        
        <div *ngIf="scenario.devices.length === 0" class="canvas-placeholder">
          <p>Canvas area - drag devices here</p>
        </div>
        <div 
          *ngFor="let device of scenario.devices" 
          class="device-on-canvas"
          [class.dragging]="selectedDevice === device"
          [class.connection-source]="connectionStartDevice === device"
          [style.left.px]="device.position.x"
          [style.top.px]="device.position.y"
          (mousedown)="onDeviceMouseDown($event, device)"
          (dblclick)="onDeviceDoubleClick(device)"
          (contextmenu)="startConnectionDrawing(device, $event)"
          (click)="endConnectionDrawing(device, $event)"
        >
          <div class="device-icon">{{ getDeviceIcon(device.type) }}</div>
          <div class="device-name">{{ device.name }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
