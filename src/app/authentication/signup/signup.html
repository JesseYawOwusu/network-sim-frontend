<div class="h-screen flex items-center justify-center overflow-hidden scrollbar-hide ">
<div class="flex gap-10 justify-evenly items-center overflow-hidden w-[90%]  rounded-2xl">
  
    <div class="grid w-[50%] bg-white p-20 h-full ">
        <div class="flex gap-5 font-bold justify-center items-center text-3xl mb-5">
            <p>Connect.</p>
            <p class="text-teal-600 font-bold">Simulate.</p>
            <p>Innovate.</p>
        </div>
        <div class="flex justify-center items-center">
            <img src="../network.png" alt="Network simulation"/>

        </div>
        <p class="text-center text-md">Your gateway to smarter network simulations.</p>
        


    </div>
    <div class="flex justify-center items-center  bg-gray-50 w-[50%]">
    <form class=" grid w-fit  gap-10 bg-white p-10  rounded-2xl shadow-lg shadow-gray-300 mt-32 mb-32 " >
        <div class="pl-10 pr-10 grid gap-2">
            <p class="text-teal-600 font-bold text-2xl text-center cursor-pointer">Create Account</p>
            <p class="text-center text-sm">Sign up to power your next network model</p>
        </div>
        
        <div class="grid gap-10 p-5 pb-0">
            <div>
                <input type="text" placeholder="Username" class="text-sm text-gray-400 w-full outline-none"/>
                <div class="w-full bg-gray-400 rounded-sm border-1 border-gray-400"></div>
            </div>
            <div>
                <input type="email" placeholder="Email" class="text-sm text-gray-400 w-full outline-none"/>
                <div class="w-full bg-gray-400 rounded-sm border-1 border-gray-400"></div>
            </div>
            <div>
                <input type="password" placeholder="Password" class="text-sm text-gray-400 w-full outline-none"/>
                <div class="w-full bg-gray-400 rounded-sm border-1 border-gray-400"></div>
            </div>
            <div>
                <input type="password" placeholder="Confirm Password" class="text-sm text-gray-400 w-full outline-none"/>
                <div class="w-full bg-gray-400 rounded-sm border-1 border-gray-400"></div>
            </div>
        </div>

        <div class="cursor-pointer">
            
            <button type="button" class="text-white bg-teal-600 rounded-md p-2 mt-0 w-13/14 m-3"> Sign Up</button>
            <p class="text-center font-light mt-0">Already have an account? <span [routerLink]="['/login']" class="text-teal-300">Sign up</span></p>
        </div>
        </form>
        </div>
 
</div>

</div>
