<div class="h-screen flex items-center justify-center overflow-hidden scrollbar-hide ">
<div class="flex gap-10 justify-evenly items-center overflow-hidden w-[90%]  rounded-2xl">
    
    
  
    <div class="hidden min-lg:grid w-[50%] bg-white">
        <div class="flex gap-5 font-bold justify-center items-center text-3xl mb-5 ">
            <p class="text-2xl text-center">Ready to build your next virtual network?</p>
        </div>
        <div class="flex justify-center items-center">
            <img src="assets/network.png" alt="Network simulation"/>

        </div>
        <p class="text-center text-md">Connect, simulate, and innovate with real-time network experiences.</p>
    </div>
    <div class="grid justify-center items-center  bg-gray-50 lg:w-[50%] sm:w-full">
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class=" grid w-contain sm:w-full gap-10 bg-white p-10  rounded-2xl shadow-lg shadow-gray-300 mt-96 mb-96" >
        <div class="pl-10 pr-10 grid gap-2">
            <p class="text-teal-600 font-bold lg:text-2xl sm:text-xl text-center cursor-pointer">Welcome Back</p>
            <p class="text-center text-sm">Login to your account</p>
        </div>
        
        <div class="grid gap-10 p-5 pb-0 ">
            <div class="active:cursor-teal-600">
                <app-input-component [controlName]="loginForm.controls.email" label="email"></app-input-component>  
            </div>
            <div>
                <app-input-component [controlName]="loginForm.controls.password" label="password"></app-input-component> 
            </div>
        </div>

        <div class="cursor-pointer">
            
            <button type="submit" [disabled]="loginForm.invalid" [class]="loginForm.invalid ? 'bg-teal-600/[40%] rounded-md p-2 mt-0 w-13/14 m-3 text-black/[30%]': 'text-white bg-teal-600 rounded-md p-2 mt-0 w-13/14 m-3'"> Login</button>
            <p class="text-center font-light mt-0">Don't have an account? <span [routerLink]="['/auth/signup']" class="text-teal-300">Create one</span></p>
        </div>
        </form>
        </div>
 
</div>

</div>
